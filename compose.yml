services:
  db:
    image: postgres:16
    container_name: orcamento-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-orcamento}
      - POSTGRES_USER=${DB_USER:-orcamento}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-orcamento}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orcamento}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - orcamento-net

  web:
    build:
      context: .
      args:
        UV_NO_DEV: true
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    command: production
    restart: unless-stopped
    volumes:
      - ./dados:/app/dados
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - orcamento-net

  # Serviço de desenvolvimento com shell interativo
  dev:
    build:
      context: .
      args:
        UV_NO_DEV: false
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - DJANGO_SETTINGS_MODULE=orcamento_2026.settings.development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dados:/app/dados
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - orcamento-net
    stdin_open: true
    tty: true
    command: /bin/zsh
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  orcamento-net:
    name: orcamento-net
